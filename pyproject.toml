[project]
name = "polyquant-intelligence"
version = "6.0.0"
description = "Persistent prediction-market quant research, audit, settlement, validation and paper-trading terminal"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","httpx>=0.27,<1","pydantic>=2.8,<3","pydantic-settings>=2.4,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
live = ["polymarket-client"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
asyncio_mode="auto"
[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["polyquant*"]
exclude=["tests*","scripts*","web*"]
