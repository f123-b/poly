[project]
name = "polyquant-intelligence"
version = "1.0.0"
description = "Prediction-market quantitative research, forecasting, backtesting and paper trading terminal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
live = ["polymarket-client"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polyquant*"]
exclude = ["tests*", "scripts*", "web*"]
